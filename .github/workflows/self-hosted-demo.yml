name: Self Hosted Runner Demo

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Welcome
        run: Write-Host "Hello from Windows Self Hosted Runner!"

      - name: Check System Info
        run: Get-ComputerInfo | Select-Object OsName, OsArchitecture

      - name: Success
        run: Write-Host "GitHub Actions Runner is working successfully!"
        