name: Self Hosted Runner Demo

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Welcome
        run: Write-Host "Hello from Windows Self Hosted Runner!"

      - name: Check System Info
        run: |
          Write-Host "OS Version: $($PSVersionTable.OS)"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"

      - name: Success
        run: Write-Host "GitHub Actions Runner is working successfully!"
        